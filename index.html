    <!-- Supressão Global e Absoluta de Logs Redundantes do Vite HMR e do Firestore WebChannel -->
    <script type="text/javascript">
      (function() {
        var containsForbiddenTerm = function(obj) {
          if (!obj) return false;
          try {
            var str = "";
            if (typeof obj === 'string') {
              str = obj;
            } else if (obj instanceof Error) {
              str = (obj.message || "") + " " + (obj.stack || "");
            } else if (typeof obj === 'object') {
              str = JSON.stringify(obj) || String(obj);
            } else {
              str = String(obj);
            }
            var lower = str.toLowerCase();
            return lower.indexOf('websocket') !== -1 || 
                   lower.indexOf('vite') !== -1 || 
                   lower.indexOf('wss://') !== -1 || 
                   lower.indexOf('ws://') !== -1 ||
                   lower.indexOf('closed without opened') !== -1 ||
                   lower.indexOf('firebase') !== -1 ||
                   lower.indexOf('firestore') !== -1 ||
                   lower.indexOf('webchannelconnection') !== -1 ||
                   lower.indexOf('transport errored') !== -1 ||
                   lower.indexOf("rpc 'write' stream") !== -1 ||
                   lower.indexOf("write' stream") !== -1;
          } catch(e) {
            return false;
          }
        };

        var shouldSuppress = function(args) {
          if (!args) return false;
          for (var i = 0; i < args.length; i++) {
            if (containsForbiddenTerm(args[i])) return true;
          }
          return false;
        };

        // 1. Interceptar chamadas de console de forma segura (preservando o objeto console original por completo)
        if (window.console) {
          var methods = ['log', 'error', 'warn', 'info'];
          for (var i = 0; i < methods.length; i++) {
            (function(method) {
              var original = window.console[method];
              if (original) {
                window.console[method] = function() {
                  if (shouldSuppress(arguments)) {
                    return; // Silencia o log completamente
                  }
                  original.apply(window.console, arguments);
                };
              }
            })(methods[i]);
          }
        }

        // 2. Interceptar window.onerror diretamente de forma segura
        var originalOnError = window.onerror;
        window.onerror = function(message, source, lineno, colno, error) {
          if (containsForbiddenTerm(message) || containsForbiddenTerm(error)) {
            return true; // Suprime o erro
          }
          if (originalOnError) {
            return originalOnError.apply(this, arguments);
          }
        };

        // 3. Interceptar window.onunhandledrejection diretamente de forma segura
        var originalUnhandled = window.onunhandledrejection;
        window.onunhandledrejection = function(e) {
          var msg = e.reason ? (e.reason.message || String(e.reason)) : '';
          if (containsForbiddenTerm(msg) || containsForbiddenTerm(e.reason)) {
            e.preventDefault();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            if (e.stopPropagation) e.stopPropagation();
            return;
          }
          if (originalUnhandled) {
            return originalUnhandled.apply(this, arguments);
          }
        };

        // 4. Interceptar addEventListener e removeEventListener de forma perfeitamente simétrica e segura
        var originalAddEventListener = window.addEventListener;
        var originalRemoveEventListener = window.removeEventListener;
        var wrappedListeners = [];

        window.addEventListener = function(type, listener, options) {
          if ((type === 'error' || type === 'unhandledrejection') && listener) {
            var wrappedListener = function(e) {
              var errorMsg = "";
              var errorObj = null;
              if (type === 'error') {
                errorMsg = e.message || (e.error && e.error.message) || "";
                errorObj = e.error;
              } else {
                errorMsg = e.reason ? (e.reason.message || String(e.reason)) : "";
                errorObj = e.reason;
              }
              if (containsForbiddenTerm(errorMsg) || containsForbiddenTerm(errorObj)) {
                e.preventDefault();
                if (e.stopImmediatePropagation) e.stopImmediatePropagation();
                if (e.stopPropagation) e.stopPropagation();
                return;
              }
              if (typeof listener === 'function') {
                listener.apply(this, arguments);
              } else if (listener && typeof listener.handleEvent === 'function') {
                listener.handleEvent.apply(listener, arguments);
              }
            };
            wrappedListeners.push({ original: listener, wrapped: wrappedListener, type: type });
            originalAddEventListener.call(this, type, wrappedListener, options);
          } else {
            originalAddEventListener.call(this, type, listener, options);
          }
        };

        window.removeEventListener = function(type, listener, options) {
          if ((type === 'error' || type === 'unhandledrejection') && listener) {
            var foundIndex = -1;
            for (var i = 0; i < wrappedListeners.length; i++) {
              if (wrappedListeners[i].original === listener && wrappedListeners[i].type === type) {
                foundIndex = i;
                break;
              }
            }
            if (foundIndex !== -1) {
              var wrapped = wrappedListeners[foundIndex].wrapped;
              wrappedListeners.splice(foundIndex, 1);
              originalRemoveEventListener.call(this, type, wrapped, options);
              return;
            }
          }
          originalRemoveEventListener.call(this, type, listener, options);
        };
      })();
    </script>

    <!-- GitHub Pages Single Page App Redirect Receiver (URLs Limpas via sessionStorage) -->
    <script type="text/javascript">
      (function(l) {
        try {
          var pathSegments = l.pathname.split('/').filter(Boolean);
          var storageKey = 'ghpages_redirect_root';
          if (pathSegments.length > 0) {
            storageKey = 'ghpages_redirect_' + pathSegments[0];
          }

          var redirectDataStr = sessionStorage.getItem(storageKey);
          if (redirectDataStr) {
            sessionStorage.removeItem(storageKey);
            var data = JSON.parse(redirectDataStr);

            if (data && data.path) {
              var basePath = l.pathname.endsWith('/') ? l.pathname.slice(0, -1) : l.pathname;
              window.history.replaceState(null, null, basePath + data.path + data.search + data.hash);
            }
          }
        } catch (e) {}
      }(window.location))
    </script>
